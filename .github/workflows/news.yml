name: Marktzeitung

# Holt alle 3 Stunden frische Schlagzeilen und legt sie als news.json ins Repo.
# Die App lädt die Datei beim Öffnen über raw.githubusercontent.com.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marktzeitung
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Schlagzeilen holen
        run: python3 news.py news.json
      - name: news.json speichern
        run: |
          git config user.name "marktzeitung-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then echo "Keine Änderung"; exit 0; fi
          git commit -m "Marktzeitung aktualisiert"
          git pull --rebase origin main
          git push origin HEAD:main
